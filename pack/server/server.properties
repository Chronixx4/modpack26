# Startwerte fuer Chronicle. Alles, was hier fehlt, legt Minecraft selbst an.
motd=Chronicle @VERSION@
# Noetig fuer Jetpacks, Create Aeronautics und Ad Astra, sonst fliegen Spieler wegen "Fliegen" raus
allow-flight=true
# Kein Watchdog-Absturz, wenn ein Tick bei viel Weltgenerierung mal laenger dauert
max-tick-time=-1
spawn-protection=0
view-distance=10
simulation-distance=6
