plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'de.chronicle'
base.archivesName = 'chronicle-arena'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }
dependencies { testImplementation 'org.mockito:mockito-core:5.14.2'; testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
test { useJUnitPlatform() }
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

neoForge {
    version = neo_version
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        server {
            server()
            systemProperty 'chronicle_arena.selftest', System.getProperty('chronicle_arena.selftest', 'false')
            systemProperty 'chronicle_arena.dump', System.getProperty('chronicle_arena.dump', '')
        }
        client {
            client()
        }
    }
}

processResources {
    var props = [mod_id: mod_id, mod_version: mod_version, neo_version: neo_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
