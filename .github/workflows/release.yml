# Baut aus pack/modrinth.index.json und curseforge-mods/*.jar das .mrpack
# und legt ein GitHub-Release an.
# Laeuft automatisch, wenn pack/modrinth.index.json auf main geaendert wird
# (gibt es das Release zu der Version schon, passiert nichts).
# Ausserdem: Tag pushen (z. B. v0.9.4) oder "Actions" -> "Release" -> "Run workflow".
name: Release

on:
  push:
    branches: [main]
    paths: ['pack/modrinth.index.json']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(jq -r .versionId pack/modrinth.index.json)
          TAG="v$VER"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu versionId $VER in pack/modrinth.index.json" >&2
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon, nichts zu tun."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: .mrpack bauen
        if: steps.ver.outputs.exists != 'true'
        run: |
          mkdir -p build/overrides/mods
          cp pack/modrinth.index.json build/
          cp curseforge-mods/*.jar build/overrides/mods/
          cd build
          zip -r -D "../Unser-Modpack-${{ steps.ver.outputs.ver }}.mrpack" modrinth.index.json overrides
          cd ..
          unzip -l "Unser-Modpack-${{ steps.ver.outputs.ver }}.mrpack" | tail -1

      - name: Release anlegen
        if: steps.ver.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Minecraft 1.21.1 / NeoForge. Nur fuer uns, bitte nicht oeffentlich weitergeben (Mod-Lizenzen)."
            echo
            echo "**Installieren:** Modrinth App -> \"+\" (Instanz hinzufuegen) -> \"Aus Datei importieren\" -> die .mrpack-Datei waehlen."
            echo
            echo '```'
            sed '1s/^\xEF\xBB\xBF//' MODLISTE.txt
            echo '```'
          } > notes.md
          gh release create "${{ steps.ver.outputs.tag }}" \
            "Unser-Modpack-${{ steps.ver.outputs.ver }}.mrpack" MODLISTE.txt \
            --target "$GITHUB_SHA" \
            --title "Unser Modpack ${{ steps.ver.outputs.ver }}" \
            --notes-file notes.md
