# Baut .mrpack, Client-ZIP und Server-ZIP, testet den Server und legt das Release an.
# - Pull Request: nur bauen + Servertest (kein Release)
# - Push auf main mit neuer pack/modrinth.index.json: bauen + Servertest + Release
#   (gibt es das Release zu der Version schon, passiert nichts)
# - Tag v<Version> oder "Actions" -> "Release" -> "Run workflow": wie Push auf main
name: Release

on:
  push:
    branches: [main]
    paths: ['pack/modrinth.index.json']
    tags: ['v*']
  pull_request:
    paths: ['pack/**', 'curseforge-mods/**', 'mod/**', 'MODLISTE.txt', '.github/**', 'tools/strukturdichte.py', 'tools/pruefe-modpack.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(jq -r .versionId pack/modrinth.index.json)
          TAG="v$VER"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu versionId $VER in pack/modrinth.index.json" >&2
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon, nichts zu tun."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Pakete bauen
        if: steps.ver.outputs.exists != 'true'
        run: bash .github/scripts/pakete-bauen.sh dist

      - name: Strukturdichte pruefen
        if: steps.ver.outputs.exists != 'true'
        run: python3 tools/strukturdichte.py --mods dist/cache --check

      - name: Arena und neue Mods pruefen
        if: steps.ver.outputs.exists != 'true'
        run: python3 tools/pruefe-modpack.py dist

      - name: Servertest
        if: steps.ver.outputs.exists != 'true'
        env:
          TEST_RAM: 5G
          TEST_TIMEOUT_MIN: 25
        run: bash .github/scripts/servertest.sh "dist/Chronicle-${{ steps.ver.outputs.ver }}-Server.zip" "$RUNNER_TEMP/servertest"

      - name: Server-Log sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: servertest-logs
          path: |
            ${{ runner.temp }}/servertest/logs/latest.log
            ${{ runner.temp }}/servertest/crash-reports/
            ${{ runner.temp }}/servertest/console.log
          if-no-files-found: ignore

      - name: Release anlegen
        if: steps.ver.outputs.exists != 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          (cd dist && sha256sum "Chronicle-$VER.mrpack" "Chronicle-$VER-Client.zip" "Chronicle-$VER-Server.zip") > dist/SHA256SUMS.txt
          {
            echo "Minecraft 1.21.1 / NeoForge. Nur fuer uns, bitte nicht oeffentlich weitergeben (Mod-Lizenzen)."
            echo
            if [ -f "pack/release-notes/$VER.md" ]; then
              cat "pack/release-notes/$VER.md"
              echo
            fi
            echo "| Datei | Wofuer |"
            echo "|---|---|"
            echo "| \`Chronicle-$VER.mrpack\` | **Modrinth App**: \"+\" -> \"Aus Datei importieren\" |"
            echo "| \`Chronicle-$VER-Client.zip\` | andere Launcher (Prism, CurseForge ...): mods-Ordner in die Instanz kopieren |"
            echo "| \`Chronicle-$VER-Server.zip\` | Server: entpacken, eula.txt bestaetigen, start.sh / start.bat (Java 21, 12 GB RAM) |"
            echo
            echo "Servertest im Workflow: bestanden."
            echo
            echo '```'
            sed '1s/^\xEF\xBB\xBF//' MODLISTE.txt
            echo '```'
          } > notes.md
          gh release create "${{ steps.ver.outputs.tag }}" \
            "dist/Chronicle-$VER.mrpack" \
            "dist/Chronicle-$VER-Client.zip" \
            "dist/Chronicle-$VER-Server.zip" \
            dist/SHA256SUMS.txt \
            MODLISTE.txt \
            --target "$GITHUB_SHA" \
            --title "Chronicle $VER" \
            --notes-file notes.md
